<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google Sign-In</title>
</head>
<body>
<script>
    (function () {
        // ดึง access_token จาก URL hash ที่ Google redirect กลับมา
        var hash = window.location.hash.substring(1);
        var params = new URLSearchParams(hash);
        var access_token = params.get('access_token');
        var error = params.get('error');

        // เขียนลง localStorage (ไม่ต้องพึ่ง window.opener ซึ่งถูกบล็อกโดย COOP)
        localStorage.setItem('_google_oauth_result', JSON.stringify({
            access_token: access_token || null,
            error: error || null,
            ts: Date.now()
        }));

        window.close();
    })();
</script>
</body>
</html>
